<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function FirstFunction () {
            alert('Hello World!');
        }
        function clicky () {
            alert('Thanks for clicking!');
        }
        function hovery () {
            alert('Thanks for rolling over me')
        }
    </script>
</head>
<body onload="FirstFunction();">
    <h1>javascript basics</h1>
    <p onclick="clicky();">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Magni provident eum deleniti? Et aspernatur debitis doloribus maiores veritatis? Quod itaque, alias id pariatur quaerat ipsum maiores! Eius odio facilis est.</p>
    <h2 onmouseover="hovery();">Hover Text</h2>
</body>
</html>
