<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- caption tag required -->
    <caption>World Population</caption>
    <table>
        <tr>
            <th>Country</th>
            <th>Population</th>
            <th>% of World</th>
            <th>Date</th>
        </tr>
        <tr>
            <td>India</td>
            <td>1,425,775,850</td>
            <td>17.2%</td>
            <td>14 Apr 2023</td>
        </tr>
        <tr>
            <td>China</td>
            <td>1,409,670,000</td>
            <td>17.0%</td>
            <td>17 Jan 2024</td>
        </tr>
        <tr>
            <td>United States</td>
            <td>339,777,727</td>
            <td>4.11%</td>
            <td>12 Sep 2026</td>
        </tr>
    </table>

    <!--forms-->

    <h1>food delivery form</h1>
    <form action=""method="post">
        <label for="fullname">Full Name: </label>
        <input type="text" id="fullname" name="fullname">
        <br>
        <!--the name will show when the form is submitted-->
        <label for="special">Special Instructions: </label>
        <textarea id="special" name="special"></textarea>
        <br>
        <p>pickup or delivery?</p>
            <input type="radio" id="delivery1" name="delivery" value="pickup">
            <label for="delivery1">Pickup</label>
            <input type="radio" id="delivery2" name="delivery" value="delivery">
            <label for="delivery2">Delivery</label>
        <br>
        <!--unlike radio, checkboxes can be unselected-->
        <input type="checkbox" id="utensils" name="utensils" value="no utensils">
        <label for="utensils">No Utensils?</label>
        <br>
        <label for="food">What Food?</label>
        <select name="food" id="food">
            <option value="sushi">Sushi</option>
            <option value="pizza">Pizza</option>
            <option value="sandwich">Sandwich</option>
        </select>
        <br>
        <input type="submit" value="Send Order">
    </form>


</body>
</html>
