<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Intro</title>
    <style>
        div {border: 1px solid black;}
        .flex2 {display: flex;}
        .flex3 {display: flex;}
        .flex3 div {flex: 1;}
    </style>
</head>
<body>
    <div class="flex1"> <!--this is flexbox row-->
        <div>1</div>
    </div>

    <div class="flex2">
        <div style="flex-basis: 25%">2</div>
        <div class="flex-basis: 75%">3</div>
    </div>

    <div class="flex3">
        <div>4</div>
        <div>5</div>
    </div>
</body>
</html>
